name: Portable Windows ZIP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
          architecture: x64
      - name: Build and smoke test embedded runtime
        run: python build_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: e10-portable-windows-x64
          path: |
            dist/e10-print-server-portable-windows-x64.zip
            dist/e10-print-server-portable-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
